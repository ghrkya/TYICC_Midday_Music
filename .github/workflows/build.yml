name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Build frontend + Electron
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CI: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: TYICC-Midday-Music-Windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Ensure mac yt-dlp executable bit
        run: chmod +x bin/mac/yt-dlp_macos

      - name: Build frontend + Electron
        run: npm run build

      - name: Build macOS installer
        run: npx electron-builder --mac --x64 --publish never
        env:
          CI: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: TYICC-Midday-Music-macOS
          path: dist/*.dmg
